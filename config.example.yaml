workflow:
  root_dir: "runtime"
  timezone: "Asia/Shanghai"
  mode: "api"  # api | codex_assisted

mail:
  backend: "outlook_com"  # outlook_com
  subject_contains: "\u7968"
  sender_contains: ""
  folder: "inbox"
  lookback_days: 3
  max_emails: 10
  include_body_chars: 4000
  question_max_chars: 5000

attachments:
  allowed_extensions:
    - ".pdf"
    - ".doc"
    - ".docx"
    - ".ppt"
    - ".pptx"
    - ".xls"
    - ".xlsx"
    - ".md"
    - ".txt"
  require_attachment: false

convert:
  enabled: true
  mineru_mode: "precise"
  model_version: "vlm"
  language: "ch"
  timeout_seconds: 7200
  interval_seconds: 15

wiki:
  root_dir: "C:\\Users\\T1UKLL7\\Desktop\\Workstation\\00-Vmodel"
  import_markdown: true
  search_limit: 8
  search_raw: true
  query_terms:
    - "\u529f\u80fd\u5b89\u5168"
    - "SOTIF"
    - "\u7f51\u7edc\u5b89\u5168"
    - "\u6cd5\u89c4"
    - "\u5408\u89c4"

llm:
  enabled: true
  required: true
  provider: "aliyun_bailian"
  model: "qwen3.7-max-2026-05-17"
  api_key_env: ""
  api_key: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  timeout_seconds: 120
  max_pages: 5
  max_page_chars: 2500
  max_context_chars: 18000
  instructions: "Answer in Chinese. Use only the provided wiki context. Cite wiki page paths or raw provenance paths where possible."

report:
  title: "\u6bcf\u65e5\u90ae\u4ef6 Wiki \u5206\u6790\u62a5\u544a"
  focus: "\u6cd5\u89c4\u5f71\u54cd\u5206\u6790\u3001\u5408\u89c4\u98ce\u9669\u3001\u5efa\u8bae\u884c\u52a8\u9879"
  include_wiki_snippets: true

send:
  backend: "outlook_com"  # outlook_com
  dry_run: true
  to:
    - "huzhe2025@163.com"
  cc: []
  subject_prefix: "[\u81ea\u52a8\u6cd5\u89c4\u5206\u6790\u62a5\u544a]"
  body: "\u8bf7\u67e5\u6536\u81ea\u52a8\u751f\u6210\u7684\u90ae\u4ef6 Wiki \u5206\u6790\u62a5\u544a\u3002"
