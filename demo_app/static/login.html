<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>G.R.C. Agent — Sign In</title>
    <style>
      :root {
        --bg: #eef2f7;
        --bg-accent: #f7f9fc;
        --surface: rgba(255, 255, 255, 0.94);
        --surface-strong: #ffffff;
        --line: #d6dcea;
        --line-soft: #e7ecf4;
        --text: #182233;
        --muted: #64748b;
        --muted-strong: #3e4a5f;
        --accent: #0f6f86;
        --accent-strong: #0b5467;
        --accent-soft: rgba(15, 111, 134, 0.08);
        --danger: #b42318;
        --shadow: 0 22px 50px rgba(15, 23, 42, 0.08);
        --shadow-soft: 0 10px 26px rgba(15, 23, 42, 0.05);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        font-family: "The Group TEXT", "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top right, rgba(15, 111, 134, 0.06), transparent 28%),
          linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        border-radius: 11px;
        padding: 10px 14px;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        transform: none;
      }

      input {
        border: 1px solid var(--line);
        border-radius: 11px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--text);
        padding: 11px 12px;
        min-height: 42px;
        width: 100%;
        outline: none;
      }

      input:focus {
        border-color: rgba(15, 111, 134, 0.55);
        box-shadow: 0 0 0 4px rgba(15, 111, 134, 0.12);
      }

      .login-card {
        width: 100%;
        max-width: 440px;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: calc(var(--radius) + 2px);
        box-shadow: var(--shadow);
        padding: 36px 32px 28px;
      }

      .brand {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 28px;
      }

      .brand-mark {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #19a0c5 0%, #0c6b86 100%);
        color: #fff;
        font-weight: 800;
        letter-spacing: 0.02em;
        box-shadow: 0 10px 22px rgba(10, 113, 143, 0.35);
        flex-shrink: 0;
      }

      .brand-kicker {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .brand h1 {
        margin: 2px 0 4px;
        font-size: 20px;
        line-height: 1.2;
      }

      .brand-note {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .tabs {
        display: flex;
        gap: 4px;
        background: #edf2f8;
        border-radius: 11px;
        padding: 4px;
        margin-bottom: 24px;
      }

      .tab-btn {
        flex: 1;
        padding: 10px 14px;
        background: transparent;
        color: var(--muted);
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
      }

      .tab-btn:hover {
        color: var(--text);
      }

      .tab-btn.active {
        background: var(--surface-strong);
        color: var(--accent-strong);
        box-shadow: var(--shadow-soft);
      }

      .form-group {
        display: grid;
        gap: 8px;
        margin-bottom: 16px;
      }

      .form-group label {
        color: var(--muted);
        font-size: 13px;
      }

      .form-group input {
        margin: 0;
      }

      .primary {
        width: 100%;
        background: linear-gradient(180deg, var(--accent) 0%, var(--accent-strong) 100%);
        color: #fff;
        box-shadow: 0 10px 22px rgba(15, 111, 134, 0.18);
        padding: 12px 14px;
        font-weight: 600;
        font-size: 15px;
      }

      .form-view {
        display: none;
      }

      .form-view.active {
        display: block;
      }

      .error-msg {
        margin: 12px 0 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(180, 35, 24, 0.08);
        border: 1px solid rgba(180, 35, 24, 0.22);
        color: var(--danger);
        font-size: 13px;
        line-height: 1.4;
        display: none;
      }

      .error-msg.show {
        display: block;
      }

      .bridge-status {
        margin-top: 24px;
        padding: 16px;
        border: 1px solid var(--line-soft);
        border-radius: 12px;
        background: var(--bg-accent);
      }

      .bridge-head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted-strong);
      }

      .bridge-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #cbd5e1;
        flex-shrink: 0;
        transition: background 0.2s ease;
      }

      .bridge-dot.connected {
        background: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18);
      }

      .bridge-dot.disconnected {
        background: var(--danger);
        box-shadow: 0 0 0 3px rgba(180, 35, 24, 0.18);
      }

      .bridge-info {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      @media (max-width: 480px) {
        body {
          padding: 12px;
        }

        .login-card {
          padding: 28px 20px 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">EW</div>
        <div>
          <p class="brand-kicker">Local Demo</p>
          <h1>G.R.C. Agent</h1>
          <p class="brand-note">Governance. Regulation. Compliance</p>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tabLogin">Login</button>
        <button class="tab-btn" id="tabRegister">Register</button>
      </div>

      <form id="loginForm" class="form-view active">
        <div class="form-group">
          <label for="loginUser">Username</label>
          <input type="text" id="loginUser" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="loginPass">Password</label>
          <input type="password" id="loginPass" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="primary">Sign In</button>
        <div class="error-msg" id="loginError"></div>
      </form>

      <form id="registerForm" class="form-view">
        <div class="form-group">
          <label for="regUser">Username</label>
          <input type="text" id="regUser" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="regDisplay">Display Name</label>
          <input type="text" id="regDisplay" name="display_name" autocomplete="name" required />
        </div>
        <div class="form-group">
          <label for="regPass">Password</label>
          <input type="password" id="regPass" name="password" autocomplete="new-password" required />
        </div>
        <div class="form-group">
          <label for="regConfirm">Confirm Password</label>
          <input type="password" id="regConfirm" name="confirm_password" autocomplete="new-password" required />
        </div>
        <button type="submit" class="primary">Create Account</button>
        <div class="error-msg" id="registerError"></div>
      </form>

      <div class="bridge-status">
        <div class="bridge-head">
          <span class="bridge-dot" id="bridgeDot"></span>
          <span id="bridgeLabel">Outlook Bridge — Checking...</span>
        </div>
        <p class="bridge-info" id="bridgeInfo">Verifying connection to your local Outlook Bridge.</p>
      </div>
    </div>

    <script>
      (function () {
        var TOKEN_KEY = "grc_token";

        var tabLogin = document.getElementById("tabLogin");
        var tabRegister = document.getElementById("tabRegister");
        var loginForm = document.getElementById("loginForm");
        var registerForm = document.getElementById("registerForm");
        var loginError = document.getElementById("loginError");
        var registerError = document.getElementById("registerError");

        function switchTab(mode) {
          if (mode === "login") {
            tabLogin.classList.add("active");
            tabRegister.classList.remove("active");
            loginForm.classList.add("active");
            registerForm.classList.remove("active");
            loginError.classList.remove("show");
          } else {
            tabRegister.classList.add("active");
            tabLogin.classList.remove("active");
            registerForm.classList.add("active");
            loginForm.classList.remove("active");
            registerError.classList.remove("show");
          }
        }

        tabLogin.addEventListener("click", function () { switchTab("login"); });
        tabRegister.addEventListener("click", function () { switchTab("register"); });

        function showError(el, message) {
          el.textContent = message;
          el.classList.add("show");
        }

        function getToken() {
          try {
            return localStorage.getItem(TOKEN_KEY) || null;
          } catch (e) {
            return null;
          }
        }

        function setToken(token) {
          try {
            localStorage.setItem(TOKEN_KEY, token);
          } catch (e) {}
        }

        function authHeaders(extra) {
          var headers = Object.assign({ "Content-Type": "application/json" }, extra || {});
          var token = getToken();
          if (token) {
            headers["Authorization"] = "Bearer " + token;
          }
          return headers;
        }

        loginForm.addEventListener("submit", function (e) {
          e.preventDefault();
          loginError.classList.remove("show");
          var username = document.getElementById("loginUser").value.trim();
          var password = document.getElementById("loginPass").value;

          if (!username || !password) {
            showError(loginError, "Please enter both username and password.");
            return;
          }

          var btn = loginForm.querySelector("button.primary");
          btn.disabled = true;
          btn.textContent = "Signing in...";

          fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: username, password: password })
          })
            .then(function (resp) {
              return resp.json().then(function (data) {
                return { ok: resp.ok, data: data };
              });
            })
            .then(function (result) {
              if (result.ok && result.data.token) {
                setToken(result.data.token);
                window.location.href = "/";
              } else {
                showError(loginError, result.data.message || result.data.error || "Login failed. Please check your credentials.");
              }
            })
            .catch(function (err) {
              showError(loginError, "Network error. Please try again.");
            })
            .finally(function () {
              btn.disabled = false;
              btn.textContent = "Sign In";
            });
        });

        registerForm.addEventListener("submit", function (e) {
          e.preventDefault();
          registerError.classList.remove("show");
          var username = document.getElementById("regUser").value.trim();
          var displayName = document.getElementById("regDisplay").value.trim();
          var password = document.getElementById("regPass").value;
          var confirmPassword = document.getElementById("regConfirm").value;

          if (!username || !displayName || !password || !confirmPassword) {
            showError(registerError, "All fields are required.");
            return;
          }

          if (password !== confirmPassword) {
            showError(registerError, "Passwords do not match.");
            return;
          }

          if (password.length < 6) {
            showError(registerError, "Password must be at least 6 characters long.");
            return;
          }

          var btn = registerForm.querySelector("button.primary");
          btn.disabled = true;
          btn.textContent = "Creating account...";

          fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              username: username,
              display_name: displayName,
              password: password,
              confirm_password: confirmPassword
            })
          })
            .then(function (resp) {
              return resp.json().then(function (data) {
                return { ok: resp.ok, data: data };
              });
            })
            .then(function (result) {
              if (result.ok) {
                if (result.data.token) {
                  setToken(result.data.token);
                  window.location.href = "/";
                } else {
                  switchTab("login");
                  showError(loginError, "Registration successful. Please sign in.");
                  loginError.classList.add("show");
                  document.getElementById("loginUser").value = username;
                }
              } else {
                showError(registerError, result.data.message || result.data.error || "Registration failed. Please try again.");
              }
            })
            .catch(function (err) {
              showError(registerError, "Network error. Please try again.");
            })
            .finally(function () {
              btn.disabled = false;
              btn.textContent = "Create Account";
            });
        });

        function checkBridgeStatus() {
          var dot = document.getElementById("bridgeDot");
          var label = document.getElementById("bridgeLabel");
          var info = document.getElementById("bridgeInfo");

          fetch("/api/bridge/status", {
            method: "GET",
            headers: authHeaders()
          })
            .then(function (resp) {
              if (!resp.ok) throw new Error("HTTP " + resp.status);
              return resp.json();
            })
            .then(function (data) {
              var connected = data.connected !== undefined ? data.connected : data.status === "connected" || data.status === "online";
              dot.classList.remove("connected", "disconnected");
              if (connected) {
                dot.classList.add("connected");
                label.textContent = "Outlook Bridge — Connected";
                info.textContent = data.message || data.email || "Your Outlook Bridge is online and ready.";
              } else {
                dot.classList.add("disconnected");
                label.textContent = "Outlook Bridge — Disconnected";
                info.textContent = data.message || "Outlook Bridge is offline. Email features will be unavailable.";
              }
            })
            .catch(function (err) {
              dot.classList.remove("connected");
              dot.classList.add("disconnected");
              label.textContent = "Outlook Bridge — Unavailable";
              info.textContent = "Unable to reach the Bridge status endpoint.";
            });
        }

        checkBridgeStatus();
        setInterval(checkBridgeStatus, 30000);
      })();
    </script>
  </body>
</html>
